name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read          # REQUIRED: deploy-pages reads the github-pages artifact uploaded by
                         # upload-pages-artifact.  When a workflow sets a permissions block,
                         # every scope it does not list is set to NONE -- so without this the
                         # artifact uploads fine and deploy-pages fails with
                         # 'Found 0 artifact(s)' even though the artifact exists.

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
