name: Refresh trade data

# Rebuilds the politician-trade dataset and republishes the static site.
#
# Target: the most current option data every WEEKDAY MORNING at 08:35 America/Chicago.
# 08:35 CT is five minutes after the 09:30 ET open (open == 08:30 CT), so the chain pull
# catches the opening quotes rather than a stale overnight close.
#
# GitHub cron is UTC-only and does not follow daylight saving, so one line can only be exact
# for half the year.  Two lines are listed -- 14:35 UTC (exact in CST, Nov-Mar) and 13:35 UTC
# (exact in CDT, Mar-Nov) -- and the `clock` job below keeps only the one that actually lands
# at 08:35 Chicago.  Both are weekdays only: 1-5.  The wrong-hour twin is skipped, not run.
on:
  schedule:
    # GitHub's own scheduler is unreliable on this repo: runs requested for 11:00 UTC have
    # started at 17:38, 19:43 and 20:54 UTC -- hours late, and on 2026-11-18 no run fired at
    # all.  A scheduled trigger therefore cannot be trusted to hit a specific morning time,
    # so it is kept only as a backup and the real clock is the Hermes cron job on the host,
    # which calls `gh workflow run` at 08:35 Chicago.  See docs in the repo notes.
    #
    # Kept weekday-only and early so a backup run still lands before the US open if the
    # external trigger fails.  The `clock` job below decides whether a firing is usable.
    - cron: "35 13 * * 1-5"   # 08:35 CDT (UTC-5) — backup, correct in summer
    - cron: "35 14 * * 1-5"   # 08:35 CST (UTC-6) — backup, correct in winter
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write        # REQUIRED by the 'Publish to GitHub Pages' step.
                        # gh workflow run dispatches a workflow, which needs actions:write.
                        # Without it the run gets HTTP 403 "Resource not accessible by
                        # integration" -- and because the data commit happens BEFORE that
                        # step, the pipeline looks successful while the site silently stays
                        # stale.  That is exactly what happened on 2026-11-20: all 17 data
                        # steps passed, the commit landed, and publish 403'd.

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  # A manual / external dispatch always runs -- that is the primary clock (the Hermes cron on
  # the host).  The window check applies ONLY to GitHub's own unreliable scheduled firings,
  # where it exists to reject the DST-mismatched twin.
  #
  # Deliberately wide (whole 08:30-08:59 Chicago hour) because GitHub starts scheduled jobs
  # 10-30 min late routinely, and on this repo far worse: runs requested at 11:00 UTC have
  # begun at 17:38 / 19:43 / 20:54 UTC.  A tight window would silently skip real runs, and a
  # silently skipped freshness job is the exact failure this whole change exists to prevent.
  # If a scheduled firing is outside the window we run anyway when nothing has refreshed in
  # 20 hours, so the data can never go more than roughly a day stale.
  clock:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      when: ${{ steps.check.outputs.when }}
      why: ${{ steps.check.outputs.why }}
    steps:
      - uses: actions/checkout@v4          # needed to read data/app_data.json's timestamp
      - id: check
        run: |
          when=$(TZ=America/Chicago date '+%Y-%m-%d %H:%M %Z')
          hhmm=$(TZ=America/Chicago date +%H%M)
          echo "when=$when" >> "$GITHUB_OUTPUT"

          # a dispatch IS the clock -- always run
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "run=yes"  >> "$GITHUB_OUTPUT"
            echo "why=dispatched" >> "$GITHUB_OUTPUT"
            echo "Chicago time is $when — dispatched ($GITHUB_EVENT_NAME), running."
            exit 0
          fi

          # scheduled: inside the morning window -> run
          if [ "$hhmm" -ge 830 ] && [ "$hhmm" -le 859 ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
            echo "why=window" >> "$GITHUB_OUTPUT"
            echo "Chicago time is $when — inside the 08:35 window, running."
            exit 0
          fi

          # scheduled but drifted out of the window: only skip if the data is still fresh.
          # These workflows always check out main first, so read the committed timestamp.
          echo "Chicago time is $when — outside the 08:35 window." >&2
          age_h=$(python3 - <<'PY' 2>/dev/null || echo 999
          import json, datetime
          d = json.load(open("data/app_data.json"))
          t = datetime.datetime.strptime(d["generated"], "%Y-%m-%dT%H:%M:%S.%fZ")
          print(int((datetime.datetime.utcnow() - t).total_seconds() // 3600))
          PY
          )
          echo "data age: ${age_h}h" >&2
          if [ "$age_h" -ge 20 ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
            echo "why=stale-fallback" >> "$GITHUB_OUTPUT"
            echo "Data is ${age_h}h old — running anyway so it cannot go stale." >&2
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "why=already-fresh" >> "$GITHUB_OUTPUT"
            echo "Data is only ${age_h}h old — the other DST twin already refreshed it." >&2
          fi

  refresh:
    needs: clock
    if: needs.clock.outputs.run == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r pipeline/requirements.txt

      # ---- House: official Clerk index + PTR PDFs -------------------------------
      - name: Fetch latest House PTRs
        run: python pipeline/fetch_house.py --days 150 --limit 70 --out data/house_trades.json

      # ---- Senate: official EFD data via a public mirror ------------------------
      # efdsearch.senate.gov (Akamai) returns 403 to automated requests, so we read
      # a community mirror that republishes the same filings and keeps the official
      # efdsearch source URL on every report. Non-fatal: keep the last good file.
      - name: Fetch latest Senate PTRs
        continue-on-error: true
        run: python pipeline/fetch_senate.py --days 150 --out data/senate_trades.json

      # ---- Merge both chambers, add prices / news / clusters --------------------
      - name: Resolve politicians (state, party, photo)
        continue-on-error: true
        run: python pipeline/politicians.py --house data/house_trades.json --senate data/senate_trades.json --out data/politicians.json

      - name: Committee assignments + jurisdiction map
        continue-on-error: true
        run: python pipeline/committees.py --out data/committees.json

      - name: Company profiles (SEC SIC sector + industry)
        continue-on-error: true
        run: python pipeline/profiles.py --in data/app_data.json --out data/profiles.json

      - name: Officers & directors (SEC Forms 3/4/5, name-verified)
        continue-on-error: true
        run: python pipeline/insiders.py --in data/app_data.json --out data/insiders.json

      # Options must run BEFORE enrich: enrich builds the dashboard's open-interest board
      # from it.
      - name: Options read (Yahoo chains)
        continue-on-error: true
        run: python pipeline/fetch_options.py --max 60 --top 10 --out data/options.json

      # Broad open-interest index for the "look up a ticker" section.  ~520 names at
      # ~2.5 s each ≈ 22 min, so it is NON-FATAL: a Yahoo rate-limit must never take the
      # whole refresh down.  Resumable — it skips whatever the previous run finished.
      - name: Open-interest lookup index (broad universe)
        continue-on-error: true
        run: python pipeline/fetch_oi_lookup.py --out data/oi_lookup.json

      - name: Enrich (prices, news, clusters, oversight, insiders, OI board)
        run: python pipeline/enrich.py --days 150 --max-tickers 120 --out data/app_data.json
      # Company identities + descriptions for the stock pages.  Runs AFTER enrich because it
      # needs the full ticker universe to know which stock pages exist; enrich embeds the
      # committed copy from the previous run, so the bundle always has it.
      - name: Company identities and descriptions
        continue-on-error: true
        run: python pipeline/fetch_companies.py --out data/companies.json --sleep 0.15 --yahoo --max 400

      # ---- Plain-English fundamentals from SEC EDGAR (10-K XBRL) ----------------
      - name: Fundamentals (SEC EDGAR)
        continue-on-error: true
        run: python pipeline/fundamentals.py --max 120 --out data/fundamentals.json

      # ---- Publish the data into the static site --------------------------------
      - name: Copy data into the site (JSON + inline fallbacks)
        run: |
          mkdir -p web/data
          cp data/app_data.json web/data/app_data.json
          { printf 'window.__CAPITOL_DATA__ = '; cat data/app_data.json; printf ';\n'; } > web/data/app_data.js
          if [ -f data/fundamentals.json ]; then
            cp data/fundamentals.json web/data/fundamentals.json
            { printf 'window.__CAPITOL_FUNDAMENTALS__ = '; cat data/fundamentals.json; printf ';\n'; } > web/data/fundamentals.js
          fi
          if [ -f data/options.json ]; then
            cp data/options.json web/data/options.json
            { printf 'window.__CAPITOL_OPTIONS__ = '; cat data/options.json; printf ';\n'; } > web/data/options.js
          fi
          if [ -f data/oi_lookup.json ]; then
            cp data/oi_lookup.json web/data/oi_lookup.json
            { printf 'window.__CAPITOL_OI_LOOKUP__ = '; cat data/oi_lookup.json; printf ';\n'; } > web/data/oi_lookup.js
          fi
          # compact OI history, so stock pages can chart where open interest has been
          if [ -f data/oi_history_summary.json ]; then
            cp data/oi_history_summary.json web/data/oi_history_summary.json
            { printf 'window.__CAPITOL_OI_HISTORY__ = '; cat data/oi_history_summary.json; printf ';\n'; } > web/data/oi_history_summary.js
          fi

      - name: Commit refreshed data
        id: commit
        run: |
          git config user.name  "capitol-flow-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/house_trades.json data/senate_trades.json data/politicians.json data/committees.json data/profiles.json data/app_data.json data/fundamentals.json data/options.json data/oi_lookup.json data/companies.json || true
          git add data/oi_history/ data/oi_history_summary.json || true
          git add web/data/ || true
          if git diff --quiet --cached; then
            echo "nothing to commit" 
            echo "pushed=no" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: daily refresh $(date -u +%F)"
            git push
            echo "pushed=yes" >> "$GITHUB_OUTPUT"
          fi

      # THE PUBLISH STEP.  Without this the site never updates.
      #
      # A push made with the workflow's GITHUB_TOKEN does NOT trigger other workflows --
      # GitHub suppresses that on purpose to prevent loops.  So the "data: daily refresh"
      # commit above never started pages.yml, whose `push.paths: web/**` filter would have
      # matched it.  Result: every refresh wrote new data to the repo that the live site
      # never served; freshness depended entirely on a human pushing a change under web/.
      # Dispatching pages.yml explicitly is the only way to publish from here.
      #
      # (page deploy is ~20s, so this is cheap; it is also why deploy-pages must never be
      # re-run after a failure -- a fresh dispatch is the safe path.)
      - name: Publish to GitHub Pages
        if: steps.commit.outputs.pushed == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
          echo "dispatched pages.yml to publish the refreshed data"
